<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC OSM Resources</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #0f766e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; display: flex; }
  aside { width: 340px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  #map { flex: 1; }
  header { padding: 16px 16px 8px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0; }
  .controls { padding: 8px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  input, select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
  .cats { display: grid; gap: 2px; }
  .cats label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0; }
  .cats input { width: auto; margin: 0; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #summary { padding: 8px 16px; color: var(--muted); font-size: 12px; }
  #list { list-style: none; margin: 0; padding: 0 0 16px; overflow-y: auto; flex: 1; }
  #list li { padding: 8px 16px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; }
  #list li:hover { background: var(--bg); }
  #list .dot { margin-top: 4px; }
  #list .meta { color: var(--muted); font-size: 12px; }
  .popup h3 { margin: 0 0 4px; font-size: 14px; }
  .popup .tag { display: inline-block; font-size: 11px; color: #fff; border-radius: 4px; padding: 1px 6px; margin-bottom: 6px; }
  .popup p { margin: 2px 0; font-size: 12px; }
  .popup a { color: var(--accent); }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    aside { width: 100%; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #list { display: none; }
    #summary { padding-bottom: 12px; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>NYC resources from OpenStreetMap</h1>
    <p class="sub">Supplementary layer for the KAVI resource map. Data © OpenStreetMap contributors (ODbL).</p>
  </header>
  <div class="controls">
    <input id="q" type="search" placeholder="Search name, address, operator…" aria-label="Search">
    <select id="borough" aria-label="Borough"><option value="">All boroughs</option></select>
    <div class="cats" id="cats"></div>
  </div>
  <div id="summary"></div>
  <ul id="list"></ul>
</aside>
<div id="map"></div>

<script>
// Category keys match the `category` column written by osm_resources_nyc.ts.
const CATEGORIES = [
  ['food', 'Food assistance', '#E69F00'],
  ['housing', 'Housing / shelter', '#0072B2'],
  ['mental_health', 'Mental health', '#CC79A7'],
  ['employment', 'Employment', '#56B4E9'],
  ['childcare', 'Childcare', '#8E6BBF'],
  ['community_centre', 'Community centres', '#D55E00'],
  ['social_services', 'Other social services', '#009E73'],
]
const COLOR = Object.fromEntries(CATEGORIES.map(([k, , c]) => [k, c]))
const LABEL = Object.fromEntries(CATEGORIES.map(([k, l]) => [k, l]))
const LIST_LIMIT = 200

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : u ? `https://${u}` : '')

let all = []
const active = new Set(CATEGORIES.map(([k]) => k))

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  bounds: [-74.26, 40.49, -73.70, 40.92],
  attributionControl: { compact: false },
})
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right')
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), 'top-right')

function matches(f) {
  const p = f.properties
  if (!active.has(p.category)) return false
  if ($('borough').value && p.borough !== $('borough').value) return false
  const q = $('q').value.trim().toLowerCase()
  return !q || [p.name, p.address, p.operator, p.subtype].join(' ').toLowerCase().includes(q)
}

function popupHtml(p) {
  const web = safeUrl(p.website)
  return `<div class="popup">
    <span class="tag" style="background:${COLOR[p.category]}">${esc(LABEL[p.category])}</span>
    <h3>${esc(p.name)}</h3>
    ${p.address ? `<p>${esc(p.address)}</p>` : ''}
    <p>${esc(p.borough)} · <span style="color:#78716c">${esc(p.subtype)}</span></p>
    ${p.phone ? `<p>☎ <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></p>` : ''}
    ${web ? `<p><a href="${esc(web)}" target="_blank" rel="noopener">Website</a></p>` : ''}
    ${p.opening_hours ? `<p>Hours: ${esc(p.opening_hours)}</p>` : ''}
    ${p.operator ? `<p>Operator: ${esc(p.operator)}</p>` : ''}
    <p><a href="${esc(p.osm_url)}" target="_blank" rel="noopener">View / edit on OSM</a></p>
  </div>`
}

function showPopup(f) {
  new maplibregl.Popup({ maxWidth: '280px' }).setLngLat(f.geometry.coordinates).setHTML(popupHtml(f.properties)).addTo(map)
}

function render() {
  const shown = all.filter(matches)
  map.getSource('resources')?.setData({ type: 'FeatureCollection', features: shown })

  const counts = {}
  for (const f of all) {
    const p = f.properties
    if ($('borough').value && p.borough !== $('borough').value) continue
    counts[p.category] = (counts[p.category] ?? 0) + 1
  }
  for (const [k] of CATEGORIES) $(`count-${k}`).textContent = counts[k] ?? 0

  $('summary').textContent = `${shown.length} of ${all.length} places` + (shown.length > LIST_LIMIT ? ` · list shows first ${LIST_LIMIT}` : '')
  const sorted = shown.slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name)).slice(0, LIST_LIMIT)
  $('list').innerHTML = sorted.map((f, i) => {
    const p = f.properties
    return `<li data-i="${i}"><span class="dot" style="background:${COLOR[p.category]}"></span>
      <div><div>${esc(p.name)}</div><div class="meta">${esc(LABEL[p.category])} · ${esc(p.address || p.borough)}</div></div></li>`
  }).join('')
  $('list').onclick = (e) => {
    const li = e.target.closest('li')
    if (!li) return
    const f = sorted[+li.dataset.i]
    map.flyTo({ center: f.geometry.coordinates, zoom: 16 })
    showPopup(f)
  }
}

$('cats').innerHTML = CATEGORIES.map(([k, label, color]) =>
  `<label><input type="checkbox" value="${k}" checked><span class="dot" style="background:${color}"></span>${label}<span class="count" id="count-${k}"></span></label>`
).join('')
$('cats').onchange = (e) => {
  e.target.checked ? active.add(e.target.value) : active.delete(e.target.value)
  render()
}
$('q').oninput = render
$('borough').onchange = render

// The list works as soon as the data arrives; the map layer joins when the style has loaded.
const dataReady = fetch('../../data/nyc_osm_resources.geojson').then((r) => r.json()).then((data) => {
  all = data.features
  const boroughs = [...new Set(all.map((f) => f.properties.borough))].sort()
  $('borough').innerHTML += boroughs.map((b) => `<option>${esc(b)}</option>`).join('')
  render()
})

map.on('load', async () => {
  await dataReady
  map.addSource('resources', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } })
  map.addLayer({
    id: 'resources',
    type: 'circle',
    source: 'resources',
    paint: {
      'circle-color': ['match', ['get', 'category'], ...CATEGORIES.flatMap(([k, , c]) => [k, c]), '#888'],
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 3.5, 14, 7, 17, 10],
      'circle-stroke-width': 1.5,
      'circle-stroke-color': '#ffffff',
    },
  })
  map.on('click', 'resources', (e) => showPopup(e.features[0]))
  map.on('mouseenter', 'resources', () => (map.getCanvas().style.cursor = 'pointer'))
  map.on('mouseleave', 'resources', () => (map.getCanvas().style.cursor = ''))
  render()
})
</script>
</body>
</html>
